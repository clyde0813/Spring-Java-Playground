spring:
  datasource:
    url: jdbc:h2:mem:testdb   # 메모리 DB
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 실행 시 스키마 생성 후 종료 시 삭제
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
